name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The test tools (Vitest 5, jsdom 30, node-web-audio-api 2) need Node 22.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
